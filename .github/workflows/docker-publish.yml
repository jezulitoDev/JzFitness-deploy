name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        continue-on-error: true
        run: |
          docker build --progress=plain -t ghcr.io/jezulitodev/jzfitness:latest . > /tmp/build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish build log to job summary
        if: always()
        run: |
          echo "## Docker build log (exit ${{ steps.build.outputs.exit_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 300 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Push image
        if: steps.build.outputs.exit_code == '0'
        run: docker push ghcr.io/jezulitodev/jzfitness:latest

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Docker build failed with exit code ${{ steps.build.outputs.exit_code }}"
          exit 1
