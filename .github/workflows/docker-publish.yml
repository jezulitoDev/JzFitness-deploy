name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (capture log)
        id: build
        run: |
          set -o pipefail
          docker build --progress=plain -t ghcr.io/jezulitodev/jzfitness:latest . 2>&1 | tee /tmp/build.log

      - name: Publish build log to job summary
        if: always()
        run: |
          {
            echo '### Docker build log (tail)';
            echo '```';
            tail -n 250 /tmp/build.log;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push image
        if: success()
        run: docker push ghcr.io/jezulitodev/jzfitness:latest
